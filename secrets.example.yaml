# secrets.example.yaml — kopiere nach secrets.yaml (nicht ins Git!)

wifi_ssid: "MEIN_WLAN"
wifi_password: "MEIN_WLAN_PASSWORT"

# Fallback-AP je Knoten
ap_password: "greenhouse-fallback"

# ESPHome API-Verschlüsselung (je Knoten idealerweise eigener Key)
api_key_hmi: "BASE64_32BYTE_KEY_HMI"
api_key_kc868: "BASE64_32BYTE_KEY_KC868"
api_key_io: "BASE64_32BYTE_KEY_IO"

# OTA
ota_password: "MEIN_OTA_PASSWORT"

# BLE-Thermometer MAC-Adressen (ATC/PVVX/BTHome)
greenhouse_sensor_mac: "A4:C1:38:00:00:01"
room_sensor_mac: "A4:C1:38:00:00:02"

# Entfeuchter WLAN-Steckdose (falls HA-Entity): entity_id in lighting/climate anpassen
dehumidifier_ha_entity: "switch.entfeuchter"
