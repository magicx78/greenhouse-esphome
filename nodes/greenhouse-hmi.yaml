# Live-Aktualisierung der LVGL-Labels + Alarmleiste
interval:
  - interval: 1s
    then:
      - lambda: |-
          char buf[48];

          // --- Übersicht ---
          snprintf(buf, sizeof(buf), "T: %.1f °C", id(gh_temp).state);
          lv_label_set_text(id(lbl_temp), buf);
          lv_label_set_text(id(lbl_c_temp), buf);
          snprintf(buf, sizeof(buf), "RH: %.0f %%", id(gh_rh).state);
          lv_label_set_text(id(lbl_rh), buf);
          lv_label_set_text(id(lbl_c_rh), buf);
          snprintf(buf, sizeof(buf), "VPD: %.2f kPa", id(vpd_leaf).state);
          lv_label_set_text(id(lbl_vpd), buf);
          lv_label_set_text(id(lbl_mode), (std::string("Modus: ") + id(sp_mode).current_option().str()).c_str());
          lv_label_set_text(id(lbl_rs485), id(rs485_online).state ? "RS485: OK" : "RS485: FEHLER");

          // Aktive Ausgänge als Kurzform (Bitbelegung: docs/rs485-register-map.md)
          uint16_t act = id(mb_active_mask).has_state() ? (uint16_t) id(mb_active_mask).state : 0;
          std::string outs;
          for (int i = 0; i < 8; i++)
            if (act & (1 << i)) { outs += "V"; outs += std::to_string(i + 1); outs += " "; }
          if (act & (1 << 8))  outs += "Pumpe ";
          if (act & (1 << 9))  outs += "LED ";
          if (act & (1 << 10)) outs += "Abluft ";
          if (outs.empty()) outs = "keine";
          lv_label_set_text(id(lbl_outputs), ("Aus: " + outs).c_str());
          lv_label_set_text(id(lbl_d_out), ("Aktiv: " + outs).c_str());

          // --- Klima ---
          snprintf(buf, sizeof(buf), "Taupunkt: %.1f °C", id(dew_point).state);
          lv_label_set_text(id(lbl_c_dew), buf);
          snprintf(buf, sizeof(buf), "VPD Luft: %.2f kPa", id(vpd_air).state);
          lv_label_set_text(id(lbl_c_vpda), buf);
          snprintf(buf, sizeof(buf), "VPD Blatt: %.2f kPa", id(vpd_leaf).state);
          lv_label_set_text(id(lbl_c_vpdl), buf);
          snprintf(buf, sizeof(buf), "Ziel-VPD: %.2f kPa", id(sp_target_vpd).state);
          lv_label_set_text(id(lbl_c_spvpd), buf);
          snprintf(buf, sizeof(buf), "Ziel-T: %.1f °C", id(sp_target_temp).state);
          lv_label_set_text(id(lbl_c_sptemp), buf);

          // --- Licht & Lüfter ---
          lv_label_set_text(id(lbl_l_state), id(g_light_on) ? "Licht: EIN" : "Licht: AUS");
          lv_label_set_text(id(lbl_l_cal), id(g_servo_cal_valid) ? "Servo-Kal.: gültig"
                                                                : "Servo-Kal.: UNGÜLTIG -> LED bleibt aus");
          snprintf(buf, sizeof(buf), "Tag: ab %d Uhr, %d h",
                   (int) id(light_day_start).state, (int) id(light_day_hours).state);
          lv_label_set_text(id(lbl_l_sched), buf);
          snprintf(buf, sizeof(buf), "Umluft: %.0f %%", id(g_desired_fan_pct));
          lv_label_set_text(id(lbl_l_fan), buf);
          snprintf(buf, sizeof(buf), "Helligkeit: %.0f %%", id(light_brightness).state);
          lv_label_set_text(id(lbl_l_bright), buf);

          // --- Diagnose ---
          lv_label_set_text(id(lbl_d_rs485), id(rs485_online).state ? "RS485: OK" : "RS485: FEHLER");

          uint16_t comm = id(mb_comm_status).has_state() ? (uint16_t) id(mb_comm_status).state : 0;
          std::string cs;
          if (comm & 1) cs += "WD-ok ";
          if (comm & 2) cs += "Write-ok ";
          if (comm & 4) cs += "Client-gesehen ";
          if (cs.empty()) cs = "-";
          lv_label_set_text(id(lbl_d_comm), ("Comm: " + cs).c_str());

          // Fehlerbits ausgeschrieben statt als nackte Zahl (Tabelle im Registerplan)
          uint16_t err = id(mb_error_mask).has_state() ? (uint16_t) id(mb_error_mask).state : 0;
          static const char *const ERR_NAMES[6] = {
              "Watchdog", "Register", "Sequenz", "Sperre", "Ventilzeit", "Pumpenzeit"};
          std::string es;
          for (int i = 0; i < 6; i++)
            if (err & (1 << i)) { es += ERR_NAMES[i]; es += " "; }
          if (es.empty()) es = "keine";
          lv_label_set_text(id(lbl_d_err), ("Fehler: " + es).c_str());

          snprintf(buf, sizeof(buf), "Sensoralter: %.0f s", id(gh_age).state);
          lv_label_set_text(id(lbl_d_age), buf);
          snprintf(buf, sizeof(buf), "Heap: %.0f B", id(diag_free_heap).state);
          lv_label_set_text(id(lbl_d_heap), buf);
          snprintf(buf, sizeof(buf), "RSSI: %.0f dBm", id(diag_wifi_rssi).state);
          lv_label_set_text(id(lbl_d_rssi), buf);
          snprintf(buf, sizeof(buf), "Uptime: %.0f s", id(diag_uptime).state);
          lv_label_set_text(id(lbl_d_up), buf);

          // --- Bewässerung ---
          lv_label_set_text(id(lbl_i_state), id(g_irrig_active) ? "Status: LÄUFT" : "Status: bereit");
          uint16_t im = id(g_irrig_mask);
          std::string iv;
          for (int i = 0; i < 8; i++)
            if (im & (1 << i)) { iv += "V"; iv += std::to_string(i + 1); iv += " "; }
          if (im & (1 << 8)) iv += "Pumpe";
          if (iv.empty()) iv = "keine";
          lv_label_set_text(id(lbl_i_valves), ("Offen: " + iv).c_str());
          snprintf(buf, sizeof(buf), "Heute: %u s", (unsigned) id(g_daily_irrig_s));
          lv_label_set_text(id(lbl_i_daily), buf);
          int zone = (int) id(irrig_zone).state;
          if (zone == 0) lv_label_set_text(id(lbl_i_zone), "Zone: keine");
          else { snprintf(buf, sizeof(buf), "Zone: %d", zone); lv_label_set_text(id(lbl_i_zone), buf); }
          snprintf(buf, sizeof(buf), "Laufzeit: %.0f s", id(irrig_valve_time).state);
          lv_label_set_text(id(lbl_i_time), buf);

          // --- Seite "Werte": Tagesextreme fortschreiben ---
          // Reset beim Tageswechsel über day_of_year statt über einen zweiten
          // on_time-Trigger: packages/irrigation.yaml erweitert `sntp_time`
          // bereits per !extend, ein zweites !extend derselben ID wäre fragil.
          {
            auto tnow = id(sntp_time).now();
            int yday = tnow.is_valid() ? tnow.day_of_year : -1;
            if (yday > 0 && yday != id(g_mm_yday)) {
              id(g_mm_yday) = yday;
              id(g_t_min) = NAN; id(g_t_max) = NAN;
              id(g_rh_min) = NAN; id(g_rh_max) = NAN;
            }
          }
          float vt = id(gh_temp).state, vr = id(gh_rh).state;
          if (!isnan(vt)) {
            if (isnan(id(g_t_min)) || vt < id(g_t_min)) id(g_t_min) = vt;
            if (isnan(id(g_t_max)) || vt > id(g_t_max)) id(g_t_max) = vt;
          }
          if (!isnan(vr)) {
            if (isnan(id(g_rh_min)) || vr < id(g_rh_min)) id(g_rh_min) = vr;
            if (isnan(id(g_rh_max)) || vr > id(g_rh_max)) id(g_rh_max) = vr;
          }

          bool feu = id(g_tf_mode);
          lv_label_set_text(id(lbl_v_title), feu ? "Luftfeuchte" : "Temperatur");
          lv_label_set_text(id(lbl_v_toggle), feu ? "Umschalten: Temperatur" : "Umschalten: Feuchte");

          float ist   = feu ? vr : vt;
          float vmin  = feu ? id(g_rh_min) : id(g_t_min);
          float vmax  = feu ? id(g_rh_max) : id(g_t_max);
          const char *unit = feu ? "%" : "°C";
          int dec = feu ? 0 : 1;

          if (isnan(ist)) lv_label_set_text(id(lbl_v_ist), "--");
          else { snprintf(buf, sizeof(buf), "%.*f %s", dec, ist, unit);
                 lv_label_set_text(id(lbl_v_ist), buf); }
          if (isnan(vmax)) lv_label_set_text(id(lbl_v_max), "Höchst: --");
          else { snprintf(buf, sizeof(buf), "Höchst: %.*f %s", dec, vmax, unit);
                 lv_label_set_text(id(lbl_v_max), buf); }
          if (isnan(vmin)) lv_label_set_text(id(lbl_v_min), "Niedrigst: --");
          else { snprintf(buf, sizeof(buf), "Niedrigst: %.*f %s", dec, vmin, unit);
                 lv_label_set_text(id(lbl_v_min), buf); }

          if (feu) {
            snprintf(buf, sizeof(buf), "Max. Feuchte: %.0f %%", id(sp_max_humidity).state);
          } else {
            snprintf(buf, sizeof(buf), "Ziel: %.1f °C", id(sp_target_temp).state);
          }
          lv_label_set_text(id(lbl_v_sp), buf);
          lv_label_set_text(id(lbl_v_spcap), feu ? "Obergrenze (löst Entfeuchten aus)" : "Zieltemperatur");

          if (isnan(id(room_temp).state)) lv_label_set_text(id(lbl_v_room), "Raum: kein Empfang");
          else { snprintf(buf, sizeof(buf), "Raum: %.1f °C · %.0f %%",
                          id(room_temp).state, id(room_rh).state);
                 lv_label_set_text(id(lbl_v_room), buf); }

          if (isnan(id(gh_age).state)) lv_label_set_text(id(lbl_v_health), "Sensor: noch kein Paket");
          else { snprintf(buf, sizeof(buf), "Batt %.0f %% · %.0f dBm · vor %.0f s",
                          id(gh_batt).state, id(gh_rssi).state, id(gh_age).state);
                 lv_label_set_text(id(lbl_v_health), buf); }

          // --- Kalibrierung ---
          lv_label_set_text(id(lbl_k_state), id(g_servo_cal_valid) ? "Servo-Kalibrierung: gültig"
                                                                   : "Servo-Kalibrierung: UNGÜLTIG");
          lv_label_set_text(id(lbl_k_light), id(g_light_on) ? "Licht freigegeben: ja"
                                                            : "Licht freigegeben: nein");
          // Scharfschaltung läuft nach 10 s von selbst wieder ab
          uint32_t nowms = millis();
          if (id(g_cal_arm_ms) != 0 && nowms >= id(g_cal_arm_ms)) id(g_cal_arm_ms) = 0;
          if (id(g_cal_arm_ms) != 0) {
            snprintf(buf, sizeof(buf), "Wirklich freigeben? (%u s)",
                     (unsigned) ((id(g_cal_arm_ms) - nowms) / 1000 + 1));
            lv_label_set_text(id(lbl_k_arm), buf);
          } else {
            lv_label_set_text(id(lbl_k_arm), "Kalibrierung freigeben");
          }

          // --- Einstellungen ---
          lv_label_set_text(id(lbl_e_mode), (std::string("Modus: ") + id(sp_mode).current_option().str()).c_str());
          lv_label_set_text(id(lbl_e_profile), (std::string("Profil: ") + id(sp_profile).current_option().str()).c_str());
          snprintf(buf, sizeof(buf), "Min-T: %.1f °C", id(sp_min_temp).state);
          lv_label_set_text(id(lbl_e_min), buf);
          snprintf(buf, sizeof(buf), "Max-T: %.1f °C", id(sp_max_temp).state);
          lv_label_set_text(id(lbl_e_max), buf);
          snprintf(buf, sizeof(buf), "Blatt-Offset: %.1f K", id(sp_leaf_offset).state);
          lv_label_set_text(id(lbl_e_leaf), buf);
      - if:
          condition:
            lambda: 'return id(emergency_active).state || id(data_stale).state || !id(rs485_online).state;'
          then:
            - lvgl.widget.show: alarm_bar
            - lambda: |-
                const char* t = id(data_stale).state ? "SENSOR VERALTET"
                              : (!id(rs485_online).state ? "RS485 AUSFALL" : "NOTFALL");
                lv_label_set_text(id(alarm_label), t);
          else:
            - lvgl.widget.hide: alarm_bar
