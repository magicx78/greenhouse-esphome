    # ------------------------------------------------------- Temperatur/Feuchte
    # Eine Seite für beide Größen statt zweier halbleerer. Der Umschaltknopf
    # wechselt, WAS gezeigt und WAS mit -/+ verstellt wird — Ist-Wert, Tages-
    # extreme und Sollwert wechseln gemeinsam.
    #
    # Wichtig bei der Feuchte: `sp_max_humidity` ist eine OBERGRENZE, kein
    # Zielwert. Ab ihr greift Priorität 6 (MAX_RH) und schaltet Abluft und
    # Entfeuchter ein. Deshalb steht dort "Max. Feuchte" und nicht "Soll".
    - id: page_values
      widgets:
        - label: { id: lbl_v_title, align: TOP_MID, y: 46, text: "Temperatur" }
        - label: { id: lbl_v_cap, align: TOP_LEFT, x: 16, y: 80, text: "Ist-Wert Gewächshaus", text_font: montserrat_14 }
        - label: { id: lbl_v_ist, align: TOP_MID, y: 100, text: "--", text_font: montserrat_40 }
        - label: { id: lbl_v_max, align: TOP_LEFT, x: 16,  y: 158, text: "Höchst: --", text_font: montserrat_14 }
        - label: { id: lbl_v_min, align: TOP_LEFT, x: 250, y: 158, text: "Niedrigst: --", text_font: montserrat_14 }
        - label: { id: lbl_v_room, align: TOP_LEFT, x: 16, y: 184, text: "Raum: --", text_font: montserrat_14 }
        - label: { id: lbl_v_health, align: TOP_LEFT, x: 16, y: 210, text: "Sensor: --", text_font: montserrat_14 }
        - label: { id: lbl_v_spcap, align: TOP_LEFT, x: 16, y: 238, text: "Sollwert", text_font: montserrat_14 }
        - button:
            id: btn_v_dn
            align: TOP_LEFT
            x: 16
            y: 258
            width: 80
            height: 60
            widgets:
              - label: { align: CENTER, text: "-" }
            on_click:
              - lambda: |-
                  if (id(g_tf_mode)) {
                    float v = id(sp_max_humidity).state - 1.0f;
                    if (v < 40.0f) v = 40.0f;
                    id(sp_max_humidity).make_call().set_value(v).perform();
                  } else {
                    float v = id(sp_target_temp).state - 0.5f;
                    if (v < 10.0f) v = 10.0f;
                    id(sp_target_temp).make_call().set_value(v).perform();
                  }
        - label: { id: lbl_v_sp, align: TOP_MID, y: 272, text: "--", text_font: montserrat_28 }
        - button:
            id: btn_v_up
            align: TOP_LEFT
            x: 384
            y: 258
            width: 80
            height: 60
            widgets:
              - label: { align: CENTER, text: "+" }
            on_click:
              - lambda: |-
                  if (id(g_tf_mode)) {
                    float v = id(sp_max_humidity).state + 1.0f;
                    if (v > 95.0f) v = 95.0f;
                    id(sp_max_humidity).make_call().set_value(v).perform();
                  } else {
                    float v = id(sp_target_temp).state + 0.5f;
                    if (v > 40.0f) v = 40.0f;
                    id(sp_target_temp).make_call().set_value(v).perform();
                  }
        - button:
            id: btn_v_toggle
            align: TOP_LEFT
            x: 16
            y: 326
            width: 290
            height: 48
            widgets:
              - label: { id: lbl_v_toggle, align: CENTER, text: "Umschalten: Feuchte" }
            on_click:
              - lambda: 'id(g_tf_mode) = !id(g_tf_mode);'
        - button:
            id: btn_v_reset
            align: TOP_LEFT
            x: 316
            y: 326
            width: 148
            height: 48
            widgets:
              - label: { align: CENTER, text: "Min/Max", text_font: montserrat_14 }
            on_click:
              - lambda: |-
                  id(g_t_min) = NAN; id(g_t_max) = NAN;
                  id(g_rh_min) = NAN; id(g_rh_max) = NAN;

    # -------------------------------------------------------------- Kalibrierung
    # Invariante 7: Die LED darf nur bei gültiger Servo-Kalibrierung an. Ohne
    # diese Seite konnte `g_servo_cal_valid` nirgends gesetzt werden — das Gate
    # war damit dauerhaft zu und Zeitplan wie Handschalter liefen ins Leere.
    # Freigabe deshalb absichtlich zweistufig: erster Druck schärft für 10 s,
    # zweiter gibt frei. Verwerfen geht jederzeit mit einem Druck.
    - id: page_calib
      widgets:
        - label: { align: TOP_MID, y: 46, text: "Kalibrierung" }
        - label: { id: lbl_k_state, align: TOP_LEFT, x: 16, y: 90,  text: "Servo-Kalibrierung: --" }
        - label: { id: lbl_k_h1, align: TOP_LEFT, x: 16, y: 132, text: "Servo am Dimmer justieren,", text_font: montserrat_14 }
        - label: { id: lbl_k_h2, align: TOP_LEFT, x: 16, y: 158, text: "Endanschläge prüfen, dann hier", text_font: montserrat_14 }
        - label: { id: lbl_k_h3, align: TOP_LEFT, x: 16, y: 184, text: "freigeben. Erst dann geht die LED.", text_font: montserrat_14 }
        - label: { id: lbl_k_light, align: TOP_LEFT, x: 16, y: 220, text: "Licht freigegeben: --" }
        - button:
            id: btn_cal_arm
            align: TOP_LEFT
            x: 16
            y: 266
            width: 448
            height: 52
            widgets:
              - label: { id: lbl_k_arm, align: CENTER, text: "Kalibrierung freigeben" }
            on_click:
              - lambda: |-
                  uint32_t now = millis();
                  if (id(g_cal_arm_ms) != 0 && now < id(g_cal_arm_ms)) {
                    id(g_servo_cal_valid) = true;
                    id(g_cal_arm_ms) = 0;
                    ESP_LOGI("hmi", "Servo-Kalibrierung freigegeben (zweistufig bestaetigt)");
                  } else {
                    id(g_cal_arm_ms) = now + 10000;
                  }
        - button:
            id: btn_cal_clear
            align: TOP_LEFT
            x: 16
            y: 326
            width: 448
            height: 48
            widgets:
              - label: { align: CENTER, text: "Kalibrierung verwerfen" }
            on_click:
              - lambda: |-
                  id(g_servo_cal_valid) = false;
                  id(g_cal_arm_ms) = 0;
                  ESP_LOGW("hmi", "Servo-Kalibrierung verworfen - LED gesperrt");

