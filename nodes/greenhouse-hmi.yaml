# nodes/greenhouse-hmi.yaml — Waveshare ESP32-S3-Touch-LCD-4
# LVGL-HMI + Supervisor + Modbus-RTU-Client zum KC868 + HA-Anbindung.
# Display/Touch nutzen vordefinierte Treiber; RS485-Pins revisionsabhängig.

substitutions:
  node_name: "greenhouse-hmi"

esphome:
  name: ${node_name}
  friendly_name: "Gewächshaus HMI"

esp32:
  variant: esp32s3
  toolchain: platformio
  # Das Board hat 16 MB Flash (per esptool am Chip verifiziert). Ohne diese
  # Angabe nimmt ESPHome 4 MB an und legt nur ~1,75 MB je OTA-Partition an —
  # damit war der Build schon zu 85,8 % voll, bevor die LVGL-Seiten dazukamen.
  # ACHTUNG: Änderung der Partitionstabelle -> nur per USB flashbar, nicht OTA.
  flash_size: 16MB
  framework:
    type: esp-idf          # laut Anforderung ESP-IDF für das Display

# Octal-PSRAM (8 MB) für LVGL-Framebuffer
psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: ../components
    components: [greenhouse_controller]

packages:
  subs: !include ../substitutions.yaml
  common: !include ../packages/common.yaml
  diagnostics: !include ../packages/diagnostics.yaml
  ble: !include ../packages/ble-sensors.yaml
  climate: !include ../packages/climate-control.yaml
  irrigation: !include ../packages/irrigation.yaml
  lighting: !include ../packages/lighting.yaml

api:
  encryption:
    key: !secret api_key_hmi

# HA als zusätzliche Zeitquelle (SNTP kommt aus common.yaml)
time:
  - platform: homeassistant
    id: ha_time

# ---- External Component: Regel-/VPD-Logik ----
greenhouse_controller:
  id: gh_ctrl
  target_temp: ${default_target_temperature}
  min_temp: ${default_min_temperature}
  max_temp: ${default_max_temperature}
  emergency_temp: ${emergency_temperature}
  target_vpd: ${default_target_vpd}
  vpd_deadband: ${default_vpd_deadband}
  leaf_offset: ${leaf_temperature_offset}
  max_humidity: ${default_max_humidity}

# SPI nur für die Init-Sequenz des Panels. Pins aus dem Schaltplan V3.0:
# LCD_SDA=IO1, LCD_SCL=IO2. Derselbe Bus führt auch zur SD-Karte — die hat
# eine eigene CS-Leitung, deshalb ist hier kein miso_pin nötig.
spi:
  - id: spi_lcd
    clk_pin: GPIO2
    mosi_pin: GPIO1

# ---- Display (vordefiniertes Modell -> Panel-Timing/Datenpins gesetzt) ----
display:
  - platform: mipi_rgb
    model: WAVESHARE-4-480x480
    id: main_display
    spi_id: spi_lcd
    cs_pin: GPIO42          # LCD_CS laut Schaltplan V3.0
    auto_clear_enabled: false
    update_interval: never    # LVGL steuert das Rendering

# ---- Touch (nativer GT911) ----
i2c:
  - id: bus_touch
    # Aus dem Schaltplan V3.0 (Modul-Pinliste): TP_SDA=IO15, TP_SCL=IO7.
    # Achtung: GPIO8/GPIO9 sind hier NICHT frei — sie führen R3 bzw. G5 des
    # RGB-Panels. Bei anderer Board-Revision neu aus deren Schaltplan lesen.
    sda: GPIO15
    scl: GPIO7
    scan: true

touchscreen:
  - platform: gt911
    id: gt911_touch
    i2c_id: bus_touch
    display: main_display

# Logger auf das native USB des S3 umlegen: die Standard-UART0-Konsole liegt
# auf GPIO43/44 — genau den Pins, die hier der RS485-/Modbus-UART belegt.
logger:
  hardware_uart: USB_SERIAL_JTAG

# ---- RS485 / Modbus-Client zum KC868 ----
uart:
  - id: uart_modbus
    tx_pin: ${hmi_rs485_tx}
    rx_pin: ${hmi_rs485_rx}
    baud_rate: ${modbus_baud_rate}
    data_bits: 8
    parity: NONE
    stop_bits: 1

modbus:
  - id: modbus_hub
    uart_id: uart_modbus
    role: client
    # Kein flow_control_pin: Der Transceiver auf V3.0 ist ein MAX13487EESA+
    # (AutoDirection) — er schaltet die Richtung selbst. Bei einer Revision mit
    # DE-Leitung hier wieder aufnehmen und den Pin aus deren Schaltplan setzen.
    #
    # ESPHomes Default ist 2000ms. Bei 19200 8N1 ist eine 7-Byte-Antwort nach
    # ~4 ms komplett; zwei Sekunden Wartezeit machen aus jedem verlorenen Frame
    # einen Bus-Stillstand. 250 ms lassen dem KC868 noch reichlich Luft — sein
    # Loop braucht im Mittel unter 50 ms.
    send_wait_time: 250ms
    # DAS hier war der eigentliche Durchsatz-Deckel: ESPHomes Default ist
    # 600ms. `ModbusClientHub::tx_delay_remaining()` sperrt den Sendekanal
    # frame_delay + turnaround_time lang nach jedem Senden UND nach jedem
    # empfangenen Byte — also nach JEDER Transaktion. Gemessen: ~660 ms je
    # Befehl, d.h. ~1,5 Befehle/s, während der Knoten 5/s einreiht. Die
    # Warteschlange lief damit dauerhaft über ("Duplicate modbus command").
    # Die Turnaround-Verzögerung stammt aus der Modbus-Spezifikation und gilt
    # dort dem BROADCAST (Adresse 0), damit alle Server den Befehl verarbeiten
    # können. Hier wird ausschließlich Adresse ${modbus_server_address} unicast
    # angesprochen, und die Antwort beendet die Transaktion ohnehin. 50 ms sind
    # bei ~10 ms Transaktionsdauer noch reichlich konservativ und lassen ~15
    # Befehle/s zu — Faktor 3 über dem, was dieser Knoten braucht.
    turnaround_time: 50ms

modbus_controller:
  - id: kc868
    modbus_id: modbus_hub
    address: ${modbus_server_address}
    update_interval: 1s

# NUR Lesewerte. Die Schreibregister 0x0004/0x0010/0x0023 sind hier bewusst
# NICHT als `number` konfiguriert: Eine modbus_controller-Entität wird immer
# auch gepollt, und ESPHome fasst benachbarte Adressen zu Bereichsbefehlen
# zusammen — 0x0004 wäre also mit 0x0005/0x0006 und 0x0010 mit 0x0011 in einem
# Lesebefehl gelandet. Schlimmer noch: `ModbusController::queue_command()`
# vergleicht per `is_equal()` ohne den Function Code, weshalb der Leserange auf
# 0x0023 und der Schreibbefehl auf 0x0023 als Duplikat galten und einander
# verdrängten. Geschrieben wird deshalb direkt per `queue_command()` aus dem
# Supervisor in packages/climate-control.yaml.
sensor:
  - platform: modbus_controller
    modbus_controller_id: kc868
    name: "KC868 Aktive Ausgänge (Modbus)"
    id: mb_active_mask
    register_type: holding
    address: 0x0011
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: kc868
    name: "KC868 Fehlermaske (Modbus)"
    id: mb_error_mask
    register_type: holding
    address: 0x0006
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: kc868
    name: "KC868 Comm-Status (Modbus)"
    id: mb_comm_status
    register_type: holding
    address: 0x0005
    value_type: U_WORD
  # Sollleistung Umluft für greenhouse-io (unkritischer Pfad)
  - platform: template
    name: "Umluft Sollleistung"
    id: umluft_soll
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 2s
    lambda: 'return id(g_desired_fan_pct);'

binary_sensor:
  - platform: template
    name: "RS485 online"
    id: rs485_online
    lambda: 'return id(mb_comm_status).has_state() && ((int) id(mb_comm_status).state & 1);'
  - platform: template
    name: "Automatik aktiv"
    lambda: |-
      std::string m = id(sp_mode).current_option().str();
      return m == "AUTO_TEMPERATURE" || m == "AUTO_VPD";

# Nur UI-Zustand, bewusst nicht persistent: Nach einem Neustart ist die
# Freigabe der Servo-Kalibrierung wieder unscharf, nicht halb erteilt.
globals:
  - id: g_cal_arm_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

button:
  - platform: template
    name: "Not-Aus"
    on_press:
      - lambda: |-
          id(sp_mode).make_call().set_option("EMERGENCY").perform();
  - platform: template
    name: "RS485 neu synchronisieren"
    on_press:
      - lambda: 'id(g_hb_counter) = 0;'
  - platform: template
    name: "Alarm quittieren"
    on_press:
      - lambda: 'ESP_LOGI("hmi","Alarm quittiert (Schutzaktion bleibt aktiv)");'

# ============================ LVGL UI ============================
# 480x480, GT911. Aufteilung — dieselbe auf JEDER Seite:
#   y   0.. 40  Alarmleiste (top_layer, nur bei Alarm sichtbar)
#   y  46..380  Seiteninhalt (Titel bei y=46, Zeilen ab y=86)
#   y 384..480  Navigationsleiste (top_layer, immer sichtbar, 8 Ziele)
# Der Inhalt beginnt bewusst unter der Alarmleiste: Ein Alarm darf Messwerte
# überlagern, aber die Seitenüberschrift soll nicht verschwinden. Nichts auf
# einer Seite darf über y=380 hinausragen, sonst verdeckt es die Navigation.
#
# Neue Seiten nach diesem Muster: Seite unter `pages:` anlegen, Labels ohne
# Werte vorbelegen ("--"), im 1s-Interval unten befüllen, Navigationsknopf
# ergänzen. Ab neun Seiten reicht die zweireihige Leiste nicht mehr — dann
# braucht es eine Menüseite statt weiterer Knöpfe.
#
# Eine Seite "Gewicht" fehlt bewusst: Die HX711-Waage lebt in
# packages/weight.yaml auf greenhouse-io, ist auf diesem Knoten nicht
# eingebunden und hätte hier keine Datenquelle. Dasselbe gilt für echte
# Lüfter-Drehzahlen (packages/fans.yaml) — die Seite Licht/Luft zeigt deshalb
# nur den Sollwert, den dieser Knoten selbst berechnet.
lvgl:
  displays:
    - main_display
  touchscreens:
    - gt911_touch
  # Idle-Dimmung / Bildschirmabschaltung
  on_idle:
    timeout: 45s
    then:
      - lvgl.pause:
  theme:
    label:
      text_font: montserrat_20
  top_layer:
    widgets:
      # Alarm-Statusleiste (auf jeder Seite sichtbar)
      - obj:
          id: alarm_bar
          align: TOP_MID
          width: 480
          height: 40
          bg_color: 0xB00020
          border_width: 0
          pad_all: 0
          hidden: true
          widgets:
            - label:
                id: alarm_label
                align: CENTER
                text: "ALARM"
                text_color: 0xFFFFFF
      # Navigationsleiste (auf jeder Seite sichtbar), zwei Reihen à vier Ziele.
      # 112x42 je Knopf — auf einem 480er-Panel rund 12x5 mm, also noch sicher
      # mit dem Finger zu treffen.
      - obj:
          id: nav_bar
          align: BOTTOM_MID
          width: 480
          height: 96
          bg_color: 0x202020
          border_width: 0
          pad_all: 0
          widgets:
            - button:
                id: nav_overview
                align: TOP_LEFT
                x: 4
                y: 4
                width: 112
                height: 42
                widgets:
                  - label: { align: CENTER, text: "Übersicht", text_font: montserrat_14 }
                on_click:
                  - lvgl.page.show: page_overview
            - button:
                id: nav_climate
                align: TOP_LEFT
                x: 122
                y: 4
                width: 112
                height: 42
                widgets:
                  - label: { align: CENTER, text: "Klima", text_font: montserrat_14 }
                on_click:
                  - lvgl.page.show: page_climate
            - button:
                id: nav_lightfan
                align: TOP_LEFT
                x: 240
                y: 4
                width: 112
                height: 42
                widgets:
                  - label: { align: CENTER, text: "Licht/Luft", text_font: montserrat_14 }
                on_click:
                  - lvgl.page.show: page_lightfan
            - button:
                id: nav_irrigation
                align: TOP_LEFT
                x: 358
                y: 4
                width: 112
                height: 42
                widgets:
                  - label: { align: CENTER, text: "Wasser", text_font: montserrat_14 }
                on_click:
                  - lvgl.page.show: page_irrigation
            - button:
                id: nav_sensors
                align: TOP_LEFT
                x: 4
                y: 50
                width: 112
                height: 42
                widgets:
                  - label: { align: CENTER, text: "Sensoren", text_font: montserrat_14 }
                on_click:
                  - lvgl.page.show: page_sensors
            - button:
                id: nav_calib
                align: TOP_LEFT
                x: 122
                y: 50
                width: 112
                height: 42
                widgets:
                  - label: { align: CENTER, text: "Kalibr.", text_font: montserrat_14 }
                on_click:
                  - lvgl.page.show: page_calib
            - button:
                id: nav_settings
                align: TOP_LEFT
                x: 240
                y: 50
                width: 112
                height: 42
                widgets:
                  - label: { align: CENTER, text: "Einstell.", text_font: montserrat_14 }
                on_click:
                  - lvgl.page.show: page_settings
            - button:
                id: nav_diag
                align: TOP_LEFT
                x: 358
                y: 50
                width: 112
                height: 42
                widgets:
                  - label: { align: CENTER, text: "Diagnose", text_font: montserrat_14 }
                on_click:
                  - lvgl.page.show: page_diag
  pages:
    # ---------------------------------------------------------------- Übersicht
    - id: page_overview
      widgets:
        - label: { align: TOP_MID, y: 46, text: "Gewächshaus – Übersicht" }
        - label: { id: lbl_temp,    align: TOP_LEFT, x: 16, y: 86,  text: "T: -- °C" }
        - label: { id: lbl_rh,      align: TOP_LEFT, x: 16, y: 120, text: "RH: -- %" }
        - label: { id: lbl_vpd,     align: TOP_LEFT, x: 16, y: 154, text: "VPD: -- kPa" }
        - label: { id: lbl_mode,    align: TOP_LEFT, x: 16, y: 188, text: "Modus: --" }
        - label: { id: lbl_rs485,   align: TOP_LEFT, x: 16, y: 222, text: "RS485: --" }
        - label: { id: lbl_outputs, align: TOP_LEFT, x: 16, y: 256, text: "Aus: --" }
        - button:
            id: btn_mode_auto
            align: TOP_LEFT
            x: 16
            y: 300
            width: 216
            height: 68
            widgets:
              - label: { align: CENTER, text: "AUTO_VPD" }
            on_click:
              - lambda: 'id(sp_mode).make_call().set_option("AUTO_VPD").perform();'
        - button:
            id: btn_emergency
            align: TOP_LEFT
            x: 248
            y: 300
            width: 216
            height: 68
            bg_color: 0xB00020
            widgets:
              - label: { align: CENTER, text: "NOT-AUS", text_color: 0xFFFFFF }
            on_click:
              - lambda: 'id(sp_mode).make_call().set_option("EMERGENCY").perform();'

    # -------------------------------------------------------------------- Klima
    - id: page_climate
      widgets:
        - label: { align: TOP_MID, y: 46, text: "Klima" }
        - label: { id: lbl_c_temp,  align: TOP_LEFT, x: 16, y: 86,  text: "T: -- °C" }
        - label: { id: lbl_c_rh,    align: TOP_LEFT, x: 16, y: 120, text: "RH: -- %" }
        - label: { id: lbl_c_dew,   align: TOP_LEFT, x: 16, y: 154, text: "Taupunkt: -- °C" }
        - label: { id: lbl_c_vpda,  align: TOP_LEFT, x: 16, y: 188, text: "VPD Luft: -- kPa" }
        - label: { id: lbl_c_vpdl,  align: TOP_LEFT, x: 16, y: 222, text: "VPD Blatt: -- kPa" }
        # Ziel-VPD (Schritt 0.05 kPa, Grenzen wie die number-Entität)
        - label: { id: lbl_c_spvpd, align: TOP_LEFT, x: 16, y: 258, text: "Ziel-VPD: -- kPa" }
        - button:
            id: btn_vpd_dn
            align: TOP_LEFT
            x: 316
            y: 246
            width: 68
            height: 48
            widgets:
              - label: { align: CENTER, text: "-" }
            on_click:
              - lambda: |-
                  float v = id(sp_target_vpd).state - 0.05f;
                  if (v < 0.4f) v = 0.4f;
                  id(sp_target_vpd).make_call().set_value(v).perform();
        - button:
            id: btn_vpd_up
            align: TOP_LEFT
            x: 392
            y: 246
            width: 68
            height: 48
            widgets:
              - label: { align: CENTER, text: "+" }
            on_click:
              - lambda: |-
                  float v = id(sp_target_vpd).state + 0.05f;
                  if (v > 2.0f) v = 2.0f;
                  id(sp_target_vpd).make_call().set_value(v).perform();
        # Zieltemperatur (Schritt 0.5 K)
        - label: { id: lbl_c_sptemp, align: TOP_LEFT, x: 16, y: 322, text: "Ziel-T: -- °C" }
        - button:
            id: btn_temp_dn
            align: TOP_LEFT
            x: 316
            y: 310
            width: 68
            height: 48
            widgets:
              - label: { align: CENTER, text: "-" }
            on_click:
              - lambda: |-
                  float v = id(sp_target_temp).state - 0.5f;
                  if (v < 10.0f) v = 10.0f;
                  id(sp_target_temp).make_call().set_value(v).perform();
        - button:
            id: btn_temp_up
            align: TOP_LEFT
            x: 392
            y: 310
            width: 68
            height: 48
            widgets:
              - label: { align: CENTER, text: "+" }
            on_click:
              - lambda: |-
                  float v = id(sp_target_temp).state + 0.5f;
                  if (v > 40.0f) v = 40.0f;
                  id(sp_target_temp).make_call().set_value(v).perform();

    # ------------------------------------------------------------- Licht/Lüfter
    - id: page_lightfan
      widgets:
        - label: { align: TOP_MID, y: 46, text: "Licht & Lüfter" }
        - label: { id: lbl_l_state, align: TOP_LEFT, x: 16, y: 86,  text: "Licht: --" }
        # Ohne gültige Servo-Kalibrierung bleibt die LED aus (Invariante 7).
        # Deshalb steht der Kalibrierstatus direkt neben dem Lichtzustand.
        - label: { id: lbl_l_cal,   align: TOP_LEFT, x: 16, y: 120, text: "Servo-Kal.: --" }
        - label: { id: lbl_l_sched, align: TOP_LEFT, x: 16, y: 154, text: "Tag: --" }
        - label: { id: lbl_l_fan,   align: TOP_LEFT, x: 16, y: 188, text: "Umluft: -- %" }
        - label: { id: lbl_l_bright, align: TOP_LEFT, x: 16, y: 234, text: "Helligkeit: -- %" }
        - button:
            id: btn_bright_dn
            align: TOP_LEFT
            x: 316
            y: 222
            width: 68
            height: 48
            widgets:
              - label: { align: CENTER, text: "-" }
            on_click:
              - lambda: |-
                  float v = id(light_brightness).state - 5.0f;
                  if (v < 0.0f) v = 0.0f;
                  id(light_brightness).make_call().set_value(v).perform();
        - button:
            id: btn_bright_up
            align: TOP_LEFT
            x: 392
            y: 222
            width: 68
            height: 48
            widgets:
              - label: { align: CENTER, text: "+" }
            on_click:
              - lambda: |-
                  float v = id(light_brightness).state + 5.0f;
                  if (v > 100.0f) v = 100.0f;
                  id(light_brightness).make_call().set_value(v).perform();
        - button:
            id: btn_light_toggle
            align: TOP_LEFT
            x: 16
            y: 300
            width: 216
            height: 68
            widgets:
              - label: { align: CENTER, text: "Licht manuell" }
            on_click:
              - lambda: 'id(light_manual).toggle();'
        - button:
            id: btn_light_off
            align: TOP_LEFT
            x: 248
            y: 300
            width: 216
            height: 68
            widgets:
              - label: { align: CENTER, text: "Licht AUS" }
            on_click:
              - lambda: |-
                  id(g_light_on) = false;
                  id(light_manual).turn_off();

    # -------------------------------------------------------------- Bewässerung
    # Bedient den Zonen-Sequencer aus packages/irrigation.yaml. Die Interlocks
    # (Pumpe nur mit offenem Ventil, max. Ventilzahl, Ventil-Laufzeit) erzwingt
    # zusätzlich der KC868 in packages/safety.yaml — diese Seite kann sie nicht
    # umgehen, sie stellt nur Zone und Laufzeit ein.
    - id: page_irrigation
      widgets:
        - label: { align: TOP_MID, y: 46, text: "Bewässerung" }
        - label: { id: lbl_i_state,  align: TOP_LEFT, x: 16, y: 86,  text: "Status: --" }
        - label: { id: lbl_i_valves, align: TOP_LEFT, x: 16, y: 118, text: "Offen: --" }
        - label: { id: lbl_i_daily,  align: TOP_LEFT, x: 16, y: 150, text: "Heute: -- s" }
        # Zone 0 = keine; run_zone ignoriert alles außerhalb 1..8
        - label: { id: lbl_i_zone, align: TOP_LEFT, x: 16, y: 194, text: "Zone: --" }
        - button:
            id: btn_zone_dn
            align: TOP_LEFT
            x: 316
            y: 182
            width: 68
            height: 48
            widgets:
              - label: { align: CENTER, text: "-" }
            on_click:
              - lambda: |-
                  float v = id(irrig_zone).state - 1.0f;
                  if (v < 0.0f) v = 0.0f;
                  id(irrig_zone).make_call().set_value(v).perform();
        - button:
            id: btn_zone_up
            align: TOP_LEFT
            x: 392
            y: 182
            width: 68
            height: 48
            widgets:
              - label: { align: CENTER, text: "+" }
            on_click:
              - lambda: |-
                  float v = id(irrig_zone).state + 1.0f;
                  if (v > 8.0f) v = 8.0f;
                  id(irrig_zone).make_call().set_value(v).perform();
        - label: { id: lbl_i_time, align: TOP_LEFT, x: 16, y: 258, text: "Laufzeit: -- s" }
        - button:
            id: btn_itime_dn
            align: TOP_LEFT
            x: 316
            y: 246
            width: 68
            height: 48
            widgets:
              - label: { align: CENTER, text: "-" }
            on_click:
              - lambda: |-
                  float v = id(irrig_valve_time).state - 5.0f;
                  if (v < 1.0f) v = 1.0f;
                  id(irrig_valve_time).make_call().set_value(v).perform();
        - button:
            id: btn_itime_up
            align: TOP_LEFT
            x: 392
            y: 246
            width: 68
            height: 48
            widgets:
              - label: { align: CENTER, text: "+" }
            on_click:
              - lambda: |-
                  float v = id(irrig_valve_time).state + 5.0f;
                  if (v > ${valve_max_time_s}) v = ${valve_max_time_s};
                  id(irrig_valve_time).make_call().set_value(v).perform();
        - button:
            id: btn_irrig_start
            align: TOP_LEFT
            x: 16
            y: 310
            width: 216
            height: 60
            widgets:
              - label: { align: CENTER, text: "Zone starten" }
            on_click:
              - script.execute:
                  id: run_zone
                  zone: !lambda 'return (int) id(irrig_zone).state;'
        - button:
            id: btn_irrig_stop
            align: TOP_LEFT
            x: 248
            y: 310
            width: 216
            height: 60
            bg_color: 0xB00020
            widgets:
              - label: { align: CENTER, text: "STOPP", text_color: 0xFFFFFF }
            on_click:
              - script.execute: stop_irrigation

